cc: clang
cc_asm: clang-unwrapped
machine: ci

xdsl-opt-backend-passes:
  avx512:
    - scf-for-loop-unroll
    - convert-vector-to-ptr
    - convert-memref-to-ptr{lower_func=true}
    - convert-ptr-type-offsets
    - canonicalize
    - convert-func-to-x86-func
    - convert-vector-to-x86{arch=avx512}
    - convert-ptr-to-x86{arch=avx512}
    - convert-arith-to-x86
    - reconcile-unrealized-casts
    - canonicalize
    - x86-infer-broadcast
    - dce
    - x86-allocate-registers
    - canonicalize

libxsmm-gemm-passes:
  - x86-prologue-epilogue-insertion

compxsmm-gemm-passes:
  avx512:
    - xsmm-tile-n-m{strategy=libxsmm-skx disable-regalloc=true}
    - xsmm-matmul-m-to-reg{strategy=libxsmm-skx}
    - xsmm-tile-k{strategy=libxsmm-skx disable-regalloc=true}
    - convert-xsmm-to-x86{strategy=libxsmm-skx disable-regalloc=true}
    - x86-regalloc-verify-liveness
    - x86-allocate-registers
    - convert-x86-scf-to-x86
    - x86-prologue-epilogue-insertion

compxsmm-kdot-gemm-passes:
  avx512:
    - xsmm-tile-n-m{strategy=zen5-kdot disable-regalloc=true}
    - xsmm-matmul-m-to-reg{strategy=zen5-kdot}
    - xsmm-tile-k{strategy=zen5-kdot disable-regalloc=true}
    - convert-xsmm-to-x86{strategy=zen5-kdot disable-regalloc=true}
    - x86-regalloc-verify-liveness
    - x86-allocate-registers
    - convert-x86-scf-to-x86
    - x86-prologue-epilogue-insertion
