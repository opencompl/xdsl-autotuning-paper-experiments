cc: clang-20
target: ci

xdsl-opt-passes-vector:
  - test-vectorize-matmul
  - convert-vector-to-ptr
  - convert-memref-to-ptr{lower_func=true}
  - convert-ptr-type-offsets
  - canonicalize
  - convert-func-to-x86-func
  - convert-vector-to-x86{arch=avx2}
  - convert-ptr-to-x86{arch=avx2}
  - convert-arith-to-x86
  - reconcile-unrealized-casts
  - canonicalize
  - x86-infer-broadcast
  - dce
  - x86-allocate-registers
  - canonicalize

targets:
  neon: {
    triple: "arm64-apple-darwin24.3.0",
    arch: "armv8.5-a",
    freq: 1.0,
    peak_f32: 0,
    libs: [],
    env: {}
  }
  ci: {
    triple: "x86_64-unknown-linux-gnu",
    arch: "x86-64",
    freq: 1.0,
    peak_f32: 0,
    libs: [],
    env: {}
  }
  tower: {
    triple: "x86_64-pc-linux-gnu",
    arch: "znver5",
    freq: 4.5,
    peak_f32: 64,
    libs: ["papi"],
    env: {"LIBPFM_FORCE_PMU":"amd64"}
  }
  pinocchio: {
    triple: "x86_64-pc-linux-gnu",
    arch: "cascadelake",
    freq: 2.1,
    peak_f32: 64,
    libs: ["papi"],
    env: {}
  }

xsmm_map: {cascadelake: clx, znver5: skx, default: noarch}
