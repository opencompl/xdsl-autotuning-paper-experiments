[project]
name = "autotuner"
version = "0.1.0"
description = "Benchmarks repository for xDSL autotuning paper."
readme = "README.md"
requires-python = ">=3.11.2"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10.3",
    "pandas>=2.3.1",
    "snakemake>=9.0",
    "snakemake-logger-plugin-rich>=0.5.0",
    "tvm==0.19.0.2025010903",
    "xdsl[dev]",
    "xtc-tools",
    # XTC's MLIR backend is split across three wheels without dependency metadata.
    # Its executables are bypassed in favour of the Nix/Docker toolchain, but the
    # LLVM shared library and native Python extensions are all required at import.
    "xtc-llvm-tools==22.1.8.2",
    "xtc-mlir-extra-tools==22.1.8.7",
    "xtc-mlir-python-bindings==22.1.8.3",
]

[project.entry-points.'xdsl.universe']
autotuner = 'autotuner.universe:AUTOTUNER_UNIVERSE'

[[tool.uv.index]]
name = "corse"
url = "https://gitlab.inria.fr/api/v4/groups/corse/-/packages/pypi/simple"
explicit = true

[tool.uv]
# xtc requires `xdsl~=0.57.1`; this project tracks a much newer xdsl revision.
override-dependencies = ["xdsl[dev]"]

[tool.uv.sources]
xtc-tools = { git = "https://github.com/xtc-tools/xtc.git", rev = "bbf98bd4af3a68a3145a802d41f5debd8f95bf2b" }
xdsl = { git = "https://github.com/xdslproject/xdsl.git", rev = "7fba22adaa453a5bc5e60308d6b1e9f617e07455" }
tvm = { index = "corse" }

[project.scripts]
hello = "autotuner.main:main"
plot-ttile = "autotuner.plot_ttile:main"
plot-ttile-squares = "autotuner.plot_ttile_squares:main"
plot-ttile-combined = "autotuner.plot_ttile_combined:main"
plot-heatmap = "autotuner.plot_heatmap:main"
libxsmm-gemm = "autotuner.libxsmm_gemm.libxsmm_generator_gemm_driver:main"
compxsmm-gemm = "autotuner.compxsmm_gemm.compxsmm_generator_gemm_driver:main"
libxtcmm-gemm = "autotuner.libxtcmm_gemm.libxtcmm_generator_gemm_driver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotuner"]

[tool.pyright]
include = ["src", "tests"]
# We need this for TypeForm, should remove it once that's in
enableExperimentalFeatures = true
