[project]
name = "autotuner"
version = "0.1.0"
description = "Benchmarks repository for xDSL autotuning paper."
readme = "README.md"
requires-python = ">=3.11.2"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.10.3",
    "pandas>=2.3.1",
    "snakemake>=8.30.0",
    "xdsl[dev]",
]

[project.entry-points.'xdsl.universe']
autotuner = 'autotuner.universe:AUTOTUNER_UNIVERSE'

[tool.uv.sources]
xdsl = { git = "https://github.com/xdslproject/xdsl.git", rev = "954e2943ffd10c5481681859b3feb866e723e631" }

[project.scripts]
hello = "autotuner.main:main"
plot-ttile = "autotuner.plot_ttile:main"
plot-cube = "autotuner.plot_cube:main"

[tool.setuptools]
package-dir = { "autotuner" = "src/autotuner" }
packages = ["autotuner"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["src", "tests"]
