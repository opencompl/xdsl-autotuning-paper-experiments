[project]
name = "autotuner"
version = "0.1.0"
description = "Benchmarks repository for xDSL autotuning paper."
readme = "README.md"
requires-python = ">=3.11.2"
dependencies = [
    "matplotlib>=3.10.3",
    "pandas>=2.3.1",
    "snakemake>=8.30.0",
    "xdsl[dev] @ git+https://github.com/xdslproject/xdsl.git@249b551e0168ac75c7769885e9f83b1b8786f4b7",
]

[project.scripts]
hello = "autotuner.main:main"
plot-ttile = "autotuner.plot_ttile:main"
plot-cube = "autotuner.plot_cube:main"

[tool.setuptools]
package-dir = { "autotuner" = "src" }
packages = ["autotuner"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["src"]
