import os

import platform
import subprocess

def has_avx256():
    try:
        system = platform.system()
        if system == "Linux":
            # Use 'lscpu' via subprocess and check for AVX flags
            output = subprocess.check_output(["lscpu"], universal_newlines=True, stderr=subprocess.DEVNULL)
            return "avx" in output
        elif system == "Darwin":  # macOS
            output = subprocess.check_output(
                ["sysctl", "-a"], universal_newlines=True, stderr=subprocess.DEVNULL
            )
            return "AVX1.0" in output or "AVX2.0" in output
    except:
        return False

if not has_avx256():
    config.unsupported = True
