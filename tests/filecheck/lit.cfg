import importlib
import importlib.util
import os
import lit.formats
from pathlib import Path

config.test_source_root = Path(__file__).parent
project_root = Path(__file__).parent.parent.parent

config.test_format = lit.formats.ShTest(preamble_commands=[f"cd {project_root}"])

config.name = "xDSL Autotuner"
config.suffixes = [".c", ".mlir", ".sh", ".s"]


def _has_xtc() -> bool:
    """
    Whether XTC can actually run, i.e. the `xtc-runtime` extra is installed.
    """
    if importlib.util.find_spec("xtc") is None:
        return False
    try:
        importlib.import_module("xtc.backends.mlir")
    except ImportError:
        return False
    return True


if _has_xtc():
    config.available_features.add("xtc")

for _var in ("XTC_MLIR_PREFIX", "XTC_LLVM_PREFIX", "LD_LIBRARY_PATH"):
    if _var in os.environ:
        config.environment[_var] = os.environ[_var]

config.substitutions.append(
    (
        "COMPXSMM_AUTO_REGALLOC_PIPELINE",
        "'xsmm-tile-n-m{strategy=libxsmm-skx disable-regalloc=true}',"
        "'xsmm-matmul-m-to-k{strategy=libxsmm-skx}',"
        "'xsmm-tile-k{disable-regalloc=true}',"
        "'convert-xsmm-to-x86{strategy=libxsmm-skx disable-regalloc=true}',"
        "x86-regalloc-verify-liveness,x86-allocate-registers,"
        "convert-x86-scf-to-x86,x86-prologue-epilogue-insertion",
    )
)

config.substitutions.append(
    (
        "COMPXSMM_MANUAL_REGALLOC_PIPELINE",
        "xsmm-tile-n-m,"
        "xsmm-matmul-m-to-k,xsmm-tile-k,"
        "convert-xsmm-to-x86,"
        "x86-regalloc-verify-liveness,"
        "convert-x86-scf-to-x86,x86-prologue-epilogue-insertion",
    )
)
