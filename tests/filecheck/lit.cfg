import os
import lit.formats
from pathlib import Path

config.test_source_root = Path(__file__).parent
project_root = Path(__file__).parent.parent.parent

config.test_format = lit.formats.ShTest(preamble_commands=[f"cd {project_root}"])

config.name = "xDSL Autotuner"
config.suffixes = [".c", ".mlir", ".sh", ".s"]

for _var in ("XTC_MLIR_PREFIX", "XTC_LLVM_PREFIX"):
    if _var in os.environ:
        config.environment[_var] = os.environ[_var]

config.substitutions.append(
    (
        "COMPXSMM_AUTO_REGALLOC_PIPELINE",
        "'xsmm-apply-schedule{strategy=libxsmm-skx disable-regalloc=true}',"
        "x86-regalloc-verify-liveness,x86-allocate-registers{arch=avx512},"
        "convert-x86-scf-to-x86,x86-prologue-epilogue-insertion",
    )
)

config.substitutions.append(
    (
        "COMPXSMM_MANUAL_REGALLOC_PIPELINE",
        "xsmm-apply-schedule,"
        "x86-regalloc-verify-liveness,"
        "convert-x86-scf-to-x86,x86-prologue-epilogue-insertion",
    )
)

# Substituted in order, so FFT_PIPELINE expands before FFT_LOWERING.
config.substitutions.append(("FFT_PIPELINE", "fft-apply-schedule,FFT_LOWERING"))

config.substitutions.append(
    (
        "FFT_LOWERING",
        "fft-legalize,x86-regalloc-verify-liveness,"
        "'x86-allocate-registers{arch=avx512}',x86-prologue-epilogue-insertion",
    )
)

# Count the bytes an assembly listing stores from vector registers.
config.substitutions.append(
    (
        "STORED_BYTES",
        "awk '/vmov[a-z]+ \\[/ "
        "{ bytes += $NF ~ /^zmm/ ? 64 : $NF ~ /^ymm/ ? 32 : 16 } "
        "END { print bytes }'",
    )
)

# Count the floating-point arithmetic instructions in an assembly listing.
config.substitutions.append(
    (
        "ARITHMETIC",
        "grep -oE '^ *v(add|sub|mul|xor|f[a-z]*[0-9]{3})p[sd]' | "
        "sed 's/^ *//' | env LC_ALL=C sort | uniq -c",
    )
)
