# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI - Docker Tests

on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/opencompl/xdsl-autotuning-ci:0.16.0
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/venv_docker
      UV_LINK_MODE: copy

    steps:
    - uses: actions/checkout@v4

    - name: Print PATH
      run: echo $PATH
    - name: Where is uv?
      run: which uv
    - name: Python sys.path
      run: python -c "import sys; print(sys.path)"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Setup virtual environment
      run: uv venv $UV_PROJECT_ENVIRONMENT --system-site-packages --python 3.12


    - name: Run tests target
      run: make tests

    - name: Prune uv cache
      run: uv cache prune --ci
