# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions

name: CI - Docker Tests

on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned toolchain image (rebuild/push via publish-docker workflow on version tags).
    # Bump this when the Dockerfile changes and a new image is published.
    container: ghcr.io/opencompl/xdsl-autotuning-ci:0.30.0
    env:
      UV_LINK_MODE: copy
      PATH: /opt/toolchain/bin:/opt/venv/bin:/bin:/usr/local/bin:/usr/bin:/sbin:/bin

    steps:
      - uses: actions/checkout@v6

      # GitHub Actions overrides the image ENTRYPOINT, so we must sync here (same as
      # docker/entrypoint.sh) before running tests.
      - name: Sync project into image venv
        working-directory: ${{ github.workspace }}
        run: uv sync --locked --inexact

      - name: Run tests target
        working-directory: ${{ github.workspace }}
        run: make tests

      - name: Prune uv cache
        working-directory: ${{ github.workspace }}
        run: uv cache prune --ci
