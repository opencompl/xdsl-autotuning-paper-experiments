# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI - Docker Tests

on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/opencompl/xdsl-autotuning-ci:0.17.0
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/venv_docker
      UV_LINK_MODE: copy

    steps:
    - uses: actions/checkout@v4

    - name: Setup virtual environment
      run: |
        # Add bin containing uv to PATH
        PATH=/root/.local/bin:$PATH
        uv venv $UV_PROJECT_ENVIRONMENT --system-site-packages --python 3.12

    - name: Run tests target
      run: |
        PATH=/root/.local/bin:$PATH
        make tests

    - name: Prune uv cache
      run: |
        PATH=/root/.local/bin:$PATH
        uv cache prune --ci
