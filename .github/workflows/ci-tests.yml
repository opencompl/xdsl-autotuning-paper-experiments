# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI - Tests

on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # If you ever decide to use the `purge` inputs of cache-nix-action to
      # delete old caches, you will need to add `actions: write` here.

    defaults:
      run:
        # Run every step inside the project's dev shell, so we don't have to
        # repeat `nix develop --command` on each one.
        shell: nix develop --command bash -e {0}

    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # Invalidate the cache when the Nix dependencies change.
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}

          # If the lockfile changes, fall back to the most recent cache for this OS.
          restore-prefixes-first-match: nix-${{ runner.os }}-

          # Only save the cache on the main branch. This prevents PRs from
          # writing unchanged (or newly bloated) caches that evict main's
          # cache from the 10GB limit.
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache uv packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-nix-${{ hashFiles('uv.lock') }}
          restore-keys: uv-nix-

      - name: Run tests
        run: make tests

      - name: Prune uv cache
        run: uv cache prune --ci
